name: inject-team-status
on:
  push:
    paths:
      - team/status-fix.js
      - .github/workflows/inject-team-status.yml
  workflow_dispatch:
jobs:
  inject:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Inject status-fix into team panel
        run: |
          if [ -f team/index.html ] && ! grep -q 'status-fix.js' team/index.html; then
            sed -i 's|</body>|<script src="status-fix.js"></script>\n</body>|' team/index.html
          fi
      - name: Commit
        run: |
          git config user.name "alpensmp-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add team/index.html
          git diff --cached --quiet || git commit -m "Helper/Admin: Status-Banner im Staff-Panel"
          git push
