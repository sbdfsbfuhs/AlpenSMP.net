<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AlpenSMP – Staff Control Center</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" href="../logo.png">
  <style>
    :root {
      --bg: #0b0f19;
      --card: rgba(15, 23, 42, 0.92);
      --input: #1e293b;
      --red: #e53935;
      --red-hover: #c62828;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: rgba(255,255,255,0.08);
      --ok: #34d399;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(rgba(11,15,25,0.85), rgba(11,15,25,0.95)),
                  url('https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?q=80&w=1920') center/cover fixed;
      color: var(--text);
      min-height: 100vh;
    }
    .navbar {
      background: rgba(11,15,25,0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 14px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .brand { font-weight: 800; font-size: 1.1rem; }
    .brand span { color: var(--red); }
    .btn {
      background: var(--red);
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }
    .btn:hover { background: var(--red-hover); }
    .btn-ghost {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
    }
    .btn-ghost:hover { background: rgba(255,255,255,0.05); color: white; }
    .container { max-width: 1100px; margin: 0 auto; padding: 32px 20px 60px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
    @media(max-width: 800px) { .grid { grid-template-columns: 1fr; } }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      backdrop-filter: blur(10px);
    }
    .card h2 { font-size: 1.2rem; margin-bottom: 6px; }
    .card .desc { color: var(--muted); font-size: 0.88rem; margin-bottom: 18px; }
    input, textarea, select {
      width: 100%;
      padding: 11px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--input);
      color: var(--text);
      margin-bottom: 10px;
      outline: none;
    }
    input:focus, textarea:focus { border-color: var(--red); }
    textarea { min-height: 80px; resize: vertical; }
    .form-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
    .form-row > * { flex: 1; min-width: 120px; }
    .list { max-height: 380px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
    .item {
      background: rgba(0,0,0,0.25);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      gap: 12px;
    }
    .item .name { font-weight: 600; }
    .item .meta { font-size: 0.78rem; color: var(--muted); margin-top: 4px; }
    .btn-icon {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      width: 32px; height: 32px;
      border-radius: 8px;
      cursor: pointer;
    }
    .btn-icon:hover { background: rgba(229,57,53,0.2); color: var(--red); }
    .empty { text-align: center; color: var(--muted); padding: 30px; }
    #loginScreen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .login-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 40px 32px;
      width: 100%;
      max-width: 380px;
      text-align: center;
    }
    .login-box h1 { margin-bottom: 8px; }
    .login-box p { color: var(--muted); margin-bottom: 24px; font-size: 0.9rem; }
    .error { color: #f87171; font-size: 0.85rem; margin-top: 12px; display: none; }
    #app { display: none; }
    .toast {
      position: fixed; bottom: 24px; left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: #1e293b; border: 1px solid var(--border);
      padding: 12px 22px; border-radius: 12px;
      opacity: 0; transition: 0.3s; z-index: 999;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="login-box">
    <h1>🏔️ Staff Center</h1>
    <p>AlpenSMP · Nur für Teammitglieder</p>
    <input type="password" id="pwInput" placeholder="Team-Passwort" style="text-align:center;">
    <button class="btn" style="width:100%;margin-top:8px;" onclick="doLogin()">Anmelden</button>
    <button class="btn btn-ghost" style="width:100%;margin-top:10px;" onclick="location.href='/'">← Zurück</button>
    <p class="error" id="loginError">Falsches Passwort</p>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div class="navbar">
    <div class="brand">🏔️ ALPEN SMP <span>// Staff</span></div>
    <div>
      <span style="font-size:0.8rem;color:var(--muted);margin-right:12px;" id="statusText">Verbinde...</span>
      <button class="btn btn-ghost" onclick="doLogout()">Abmelden</button>
    </div>
  </div>

  <div class="container">
    <div class="grid">

      <!-- BANS -->
      <div class="card">
        <h2>⛔ Gebannte Spieler</h2>
        <p class="desc">Alle Teamler sehen diese Liste live.</p>
        <div class="form-row">
          <input type="text" id="banName" placeholder="Spielername">
          <input type="text" id="banReason" placeholder="Grund">
        </div>
        <select id="banDuration">
          <option>Permanent</option>
          <option>30 Tage</option>
          <option>14 Tage</option>
          <option>7 Tage</option>
          <option>1 Tag</option>
        </select>
        <button class="btn" style="width:100%;margin-top:8px;" onclick="addBan()">+ Ban eintragen</button>
        <div class="list" id="banList"></div>
      </div>

      <!-- NOTIZEN -->
      <div class="card">
        <h2>📝 Team-Notizen</h2>
        <p class="desc">Interne Notizen für das ganze Team.</p>
        <textarea id="noteText" placeholder="Neue Notiz..."></textarea>
        <button class="btn" style="width:100%;" onclick="addNote()">+ Notiz speichern</button>
        <div class="list" id="noteList"></div>
      </div>

      <!-- WARNUNGEN -->
      <div class="card" style="grid-column:1/-1;">
        <h2>⚠️ Warnungen</h2>
        <p class="desc">Verwarnungen, die noch kein Ban sind.</p>
        <div class="form-row">
          <input type="text" id="warnName" placeholder="Spielername">
          <input type="text" id="warnReason" placeholder="Grund">
          <button class="btn" onclick="addWarn()">+ Warnung</button>
        </div>
        <div class="list" id="warnList"></div>
      </div>

    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- Firebase SDK (Compat-Version) -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

<script>
  // ========== DEINE FIREBASE CONFIG ==========
  const firebaseConfig = {
    apiKey: "AIzaSyBugFF4T6y_XEhCYde99bwpSyYZOuKbJHc",
    authDomain: "alpensmp-ad844.firebaseapp.com",
    databaseURL: "https://alpensmp-ad844-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "alpensmp-ad844",
    storageBucket: "alpensmp-ad844.firebasestorage.app",
    messagingSenderId: "1089764768356",
    appId: "1:1089764768356:web:67ab90395c8460cb4c3d71",
    measurementId: "G-M170GKH3LX"
  };
  // ==========================================

  const TEAM_PASSWORD = "alpen2026"; // ← hier euer Team-Passwort ändern!

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  // Login
  function doLogin() {
    const pw = document.getElementById("pwInput").value.trim();
    if (pw === TEAM_PASSWORD) {
      sessionStorage.setItem("alpensmp_staff", "1");
      showApp();
    } else {
      document.getElementById("loginError").style.display = "block";
    }
  }
  function doLogout() {
    sessionStorage.removeItem("alpensmp_staff");
    location.reload();
  }
  function showApp() {
    document.getElementById("loginScreen").style.display = "none";
    document.getElementById("app").style.display = "block";
    startListeners();
  }
  if (sessionStorage.getItem("alpensmp_staff") === "1") showApp();

  document.getElementById("pwInput").addEventListener("keydown", e => {
    if (e.key === "Enter") doLogin();
  });

  // Live-Daten
  function startListeners() {
    document.getElementById("statusText").textContent = "● Live verbunden";
    document.getElementById("statusText").style.color = "var(--ok)";

    db.ref("bans").on("value", snap => {
      const data = snap.val() || {};
      renderList("banList", Object.entries(data).reverse(), "ban");
    });
    db.ref("notes").on("value", snap => {
      const data = snap.val() || {};
      renderList("noteList", Object.entries(data).reverse(), "note");
    });
    db.ref("warns").on("value", snap => {
      const data = snap.val() || {};
      renderList("warnList", Object.entries(data).reverse(), "warn");
    });
  }

  function renderList(id, entries, type) {
    const el = document.getElementById(id);
    if (!entries.length) {
      el.innerHTML = '<div class="empty">Noch keine Einträge</div>';
      return;
    }
    el.innerHTML = entries.map(([key, item]) => {
      if (type === "ban") {
        return `<div class="item">
          <div>
            <div class="name">${esc(item.name)}</div>
            <div>${esc(item.reason)} · <strong>${esc(item.duration)}</strong></div>
            <div class="meta">${formatDate(item.ts)}</div>
          </div>
          <button class="btn-icon" onclick="removeItem('bans','${key}')">✕</button>
        </div>`;
      }
      if (type === "note") {
        return `<div class="item">
          <div>
            <div>${esc(item.text)}</div>
            <div class="meta">${formatDate(item.ts)}</div>
          </div>
          <button class="btn-icon" onclick="removeItem('notes','${key}')">✕</button>
        </div>`;
      }
      if (type === "warn") {
        return `<div class="item">
          <div>
            <div class="name">${esc(item.name)}</div>
            <div>${esc(item.reason)}</div>
            <div class="meta">${formatDate(item.ts)}</div>
          </div>
          <button class="btn-icon" onclick="removeItem('warns','${key}')">✕</button>
        </div>`;
      }
    }).join("");
  }

  function addBan() {
    const name = document.getElementById("banName").value.trim();
    const reason = document.getElementById("banReason").value.trim() || "–";
    const duration = document.getElementById("banDuration").value;
    if (!name) return toast("Name fehlt");
    db.ref("bans").push({ name, reason, duration, ts: Date.now() });
    document.getElementById("banName").value = "";
    document.getElementById("banReason").value = "";
    toast("Ban eingetragen ✓");
  }

  function addNote() {
    const text = document.getElementById("noteText").value.trim();
    if (!text) return toast("Notiz leer");
    db.ref("notes").push({ text, ts: Date.now() });
    document.getElementById("noteText").value = "";
    toast("Notiz gespeichert ✓");
  }

  function addWarn() {
    const name = document.getElementById("warnName").value.trim();
    const reason = document.getElementById("warnReason").value.trim() || "–";
    if (!name) return toast("Name fehlt");
    db.ref("warns").push({ name, reason, ts: Date.now() });
    document.getElementById("warnName").value = "";
    document.getElementById("warnReason").value = "";
    toast("Warnung eingetragen ✓");
  }

  function removeItem(path, key) {
    if (!confirm("Wirklich löschen?")) return;
    db.ref(path + "/" + key).remove();
    toast("Gelöscht");
  }

  function esc(s) {
    const d = document.createElement("div");
    d.textContent = s;
    return d.innerHTML;
  }
  function formatDate(ts) {
    return new Date(ts).toLocaleString("de-DE", {
      day: "2-digit", month: "2-digit", year: "2-digit",
      hour: "2-digit", minute: "2-digit"
    });
  }
  function toast(msg) {
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    setTimeout(() => t.classList.remove("show"), 2200);
  }
</script>
</body>
</html>
