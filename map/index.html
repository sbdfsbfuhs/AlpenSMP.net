<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AlpenSMP – Live-Karte</title>
<link rel="icon" href="https://alpensmp.net/logo.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Outfit:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#080a0e;--text:#f2f4f7;--text2:#c5cbd6;--red:#c73e3e}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:14px 18px;border-bottom:1px solid rgba(255,255,255,.08);background:rgba(8,10,14,.94)}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:#fff;font-family:Outfit,sans-serif;font-weight:800}
.logo img{width:36px;height:36px;border-radius:9px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:10px 16px;border-radius:12px;text-decoration:none;font-weight:700;color:#fff}
.btn-p{background:linear-gradient(135deg,#b91c1c,#c73e3e)}
.btn-s{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14)}
.frame{flex:1;min-height:0;position:relative}
iframe{width:100%;height:100%;min-height:70vh;border:0;background:#0b0f16}
.note{padding:10px 18px;color:var(--text2);font-size:.9rem;border-top:1px solid rgba(255,255,255,.08)}
</style>
</head>
<body>
<div class="bar">
<a class="logo" href="https://alpensmp.net/"><img src="https://alpensmp.net/logo.png" alt="">ALPEN SMP Karte</a>
<div class="actions">
<a class="btn btn-s" href="https://alpensmp.net/">Zur Website</a>
<a class="btn btn-p" href="http://eu9-o.falixserver.net:26040/#hauptworld:-1792:102:500:132:0:0:0:0:perspective" target="_blank" rel="noopener">Karte in neuem Tab</a>
</div>
</div>
<div class="frame">
<iframe title="AlpenSMP BlueMap" src="http://eu9-o.falixserver.net:26040/#hauptworld:-1792:102:500:132:0:0:0:0:perspective" allowfullscreen></iframe>
</div>
<p class="note">BlueMap Hauptwelt. Zoomen und verschieben im Fenster. Manche Browser blockieren HTTP-Karten auf HTTPS-Seiten – dann den roten Button nutzen.</p>
</body>
</html>
