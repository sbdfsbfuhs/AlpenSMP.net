<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AlpenSMP – Weltkarte</title>
<link rel="icon" href="https://alpensmp.net/logo.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Outfit:wght@700;800&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#080a0e;
  --text:#f2f4f7;
  --text2:#c5cbd6
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0
}

html{
  height:100%
}

body{
  font-family:Inter,system-ui,sans-serif;
  background:var(--bg);
  color:var(--text);
  display:flex;
  flex-direction:column;
  min-height:100vh
}

.bar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  flex-wrap:wrap;
  padding:14px 18px;
  border-bottom:1px solid rgba(255,255,255,.08);
  flex-shrink:0
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
  color:#fff;
  text-decoration:none;
  font-family:Outfit,sans-serif;
  font-weight:800
}

.logo img{
  width:36px;
  height:36px;
  border-radius:9px
}

.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:44px;
  padding:10px 16px;
  border-radius:12px;
  text-decoration:none;
  font-weight:700;
  color:#fff;
  border:0;
  cursor:pointer
}

.btn-p{
  background:linear-gradient(135deg,#b91c1c,#c73e3e)
}

.btn-s{
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.14)
}

.content{
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:40px 18px
}

.btn-large{
  min-height:48px;
  padding:14px 32px;
  font-size:16px;
  font-weight:700
}
</style>
</head>

<body>

<div class="bar">

  <a class="logo" href="https://alpensmp.net/">
    <img src="https://alpensmp.net/logo.png" alt="AlpenSMP">
    AlpenSMP Weltkarte
  </a>

</div>

<div class="content">

  <a
    class="btn btn-p btn-large"
    href="https://alpensmp-map.falix.org/#hauptworld:-1792:102:500:132:0:0:0:0:perspective"
    target="_blank"
    rel="noopener"
  >
    🗺️ AlpenSMP BlueMap öffnen
  </a>

</div>

</body>
</html>
